[package]
name = "zengif"
version = "0.8.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Server-side GIF codec with zero-trust design, memory bounds, streaming, and full animation transparency support"
repository = "https://github.com/imazen/zengif"
documentation = "https://docs.rs/zengif"
keywords = ["gif", "image", "animation", "codec", "server"]
categories = ["multimedia::images", "encoding"]
readme = "README.crates.md"
include = [
    "/src/**",
    "/examples/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[features]
default = ["std", "zenquant"]
# std feature - enables std::error::Error impl and std I/O traits
# Disable for no_std+alloc environments (e.g., WASM)
# zencodec/std: lets `ErrorCategory::Io`'s `CodecIoKind` carry the real
# `std::io::ErrorKind` (via `CodecIoKind::from`) instead of only the opaque
# no_std-safe form — used by `GifError`'s `CategorizedError` impl below.
std = ["gif/std", "enough/std", "whereat/std", "zencodec/std"]
# zencodec is now a REQUIRED, always-on dependency (no cargo feature). The
# std-only codec glue (GifEncoderConfig/GifDecoderConfig + the CategorizedError /
# SourceEncodingDetails impls) is gated on the existing `std` feature — which the
# removed `zencodec` feature already implied — so no_std/wasm builds are unaffected.
# zennode = ["dep:zennode"]
# Expert-only cross-codec uniformity knobs. Pure visibility gate (no deps):
# exposes `InternalParams` + `EncoderConfig::with_internal_params`, mirroring
# `zenjpeg`'s `__expert` feature so a single picker model can drive every zen
# codec with one Option-bundle shape. No new tunables — the fields route
# through existing public builder setters. Requires `std` (the encoder is
# std-only).
__expert = ["std"]

# Color quantization backends (choose one or more)
# zenquant: Best perceptual quality (butteraugli/SSIMULACRA2), AGPL-3.0-or-later
zenquant = ["dep:zenquant"]
# quantette: Oklab k-means, high quality, fast, MIT/Apache-2.0
quantette = ["dep:quantette"]
# quantizr: Fast, MIT licensed
quantizr = ["dep:quantizr"]
# imagequant: Good compression (smallest files), GPL-3.0-or-later licensed
# Note: GPL requires source disclosure. Commercial license: https://pngquant.org
imagequant = ["dep:imagequant"]
# color_quant: Fastest encoder, MIT licensed (good for high-throughput)
color_quant = ["dep:color_quant"]
# RGB/imgref ecosystem interop
imgref-interop = ["imgref"]

[dependencies]
# Core GIF codec (no_std compatible with alloc)
gif = { version = "0.14.1", default-features = false }

# Error tracing for production debugging (no_std compatible)
whereat = { version = "0.1.5", default-features = false }

# Cooperative cancellation (no_std compatible)
enough = { version = "0.4.3", default-features = false }

# Safe transmutes for pixel data (no_std compatible)
bytemuck = { version = "1.21.0", features = ["derive", "extern_crate_alloc"] }

# Derive Error/Display for error types (no_std compatible)
thiserror = { version = "2.0.18", default-features = false }

# Shared codec traits (required, always-on; std-only glue gated on `std`)
zencodec = { version = ">=0.1.26, <0.3.0" }

# Node definitions (optional)
# zennode = { path = "../zennode/zennode", optional = true, default-features = false, features = ["derive"] }
zenpixels = { version = ">=0.2.10, <0.4.0", default-features = false }
linear-srgb = { version = "0.6.7"}
garb = { version = "0.2.5", default-features = false }

# Color quantization backends (optional)
imagequant = { version = "4.4.1", optional = true }
quantizr = { version = "1.4.3", optional = true }
zenquant = { version = "0.1.1", optional = true, default-features = false, features = ["std"] }
quantette = { version = "0.5.1", optional = true, default-features = false, features = ["kmeans", "std"] }
color_quant = { version = "1.1.0", optional = true }

# RGB/imgref ecosystem interop (optional)
rgb = "0.8.50"
imgref = { version = "1.12.0", optional = true }

[dev-dependencies]
# Testing
# zencodec-testkit: companion crate providing conformance checks
# (e.g. `check_decode_truncation_series`). Its zencodec requirement
# (^0.1.26) resolves from crates.io, same as our own dep — one unified
# zencodec in the graph, no patch needed.
zencodec-testkit = ">=0.1.0, <0.3.0"
almost-enough = "0.4.3"
zenutils-fuzz = "0.1.0"
imgref = "1.12.0"
codec-corpus = "1.0.3"
archmage = { version = "0.9.15", features = ["std"] }

# Dependencies that don't work on wasm32
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenbench = { version = "0.1.7", features = ["criterion-compat"] }
# Quality metrics for quantizer comparison tests
fast-ssim2 = { version = "0.7.1", features = ["imgref"] }
# PNG decoding for quantizer quality tests
png = "0.18.1"

[profile.release]
lto = "thin"
debug = 1  # For profiling

[profile.test]
opt-level = 2  # Tests need speed for processing

[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "wasm_decode"
required-features = ["std"]

[[example]]
name = "alloc_profile"
required-features = ["std"]

[[example]]
name = "memory_profile"
required-features = ["std"]

[[example]]
name = "benchmark_output"
required-features = ["std"]

[[example]]
name = "size_analysis"
required-features = ["std", "quantizr"]

[[example]]
name = "rmse_analysis"
required-features = ["std", "quantizr"]

[[example]]
name = "test_hybrid_fallback"
required-features = ["std", "quantizr"]

[[example]]
name = "test_thresholds"
required-features = ["std", "quantizr"]

[[example]]
name = "profile_decode"
required-features = ["std"]

# ENCODE peak-memory probe (VmHWM/heaptrack sweep). Needs a quantizer backend
# for `.quality()` + actual encode; `zenquant` is in default features.
[[example]]
name = "mem_probe_encode"
required-features = ["std", "zenquant"]

[[bench]]
name = "codec"
harness = false
required-features = ["std"]

[[bench]]
name = "decode_bench"
harness = false
required-features = ["std"]

[[bench]]
name = "expand_palette"
harness = false
