[package]
name = "zengif"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Server-side GIF codec with zero-trust design, memory bounds, streaming, and full animation transparency support"
repository = "https://github.com/imazen/zengif"
documentation = "https://docs.rs/zengif"
keywords = ["gif", "image", "animation", "codec", "server"]
categories = ["multimedia::images", "encoding"]
readme = "README.md"

[features]
default = ["std"]
# std feature - enables std::error::Error impl and std I/O traits
# Disable for no_std+alloc environments (e.g., WASM)
std = ["gif/std", "enough/std", "whereat/std"]
# SIMD acceleration (opt-in)
simd = ["wide", "multiversed"]

# Color quantization backends (choose one or more)
# quantizr: Best quality, fast, MIT licensed (RECOMMENDED)
quantizr = ["dep:quantizr"]
# imagequant: Best compression (smallest files), AGPL-3.0 licensed
# Note: AGPL requires source disclosure. Commercial license: https://pngquant.org
imagequant = ["dep:imagequant"]
# color_quant: Fastest encoder, MIT licensed (good for high-throughput)
color_quant = ["dep:color_quant"]
# exoquant-deprecated: Slow K-Means quantizer, kept for compatibility
# Use quantizr instead (faster AND better quality)
exoquant-deprecated = ["dep:exoquant"]

# RGB/imgref ecosystem interop
rgb-interop = ["rgb"]
imgref-interop = ["imgref", "rgb-interop"]

[dependencies]
# Core GIF codec (no_std compatible with alloc)
gif = { version = "0.14", default-features = false }

# Error tracing for production debugging (no_std compatible)
whereat = { version = "0.1", default-features = false }

# Cooperative cancellation (no_std compatible)
enough = { version = "0.3", default-features = false }

# Color quantization backends (optional)
imagequant = { version = "4.4", optional = true }
quantizr = { version = "1.4", optional = true }
exoquant = { version = "0.2", optional = true }
color_quant = { version = "1.1", optional = true }

# SIMD acceleration (optional)
wide = { version = "1.1", optional = true }
# x86-64-v3 = AVX2 (Haswell+), x86-64-v4 = AVX-512 (Zen4+/Xeon)
# aarch64-basic = NEON (Apple Silicon, Cortex-A75+)
multiversed = { version = "0.1", features = ["x86-64-v3", "x86-64-v4", "aarch64-basic"], optional = true }

# RGB/imgref ecosystem interop (optional)
rgb = { version = "0.8", optional = true }
imgref = { version = "1.12", optional = true }

[dev-dependencies]
# Testing
almost-enough = "0.3"
imgref = "1.12"

# Dependencies that don't work on wasm32
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Quality metrics for quantizer comparison tests
fast-ssim2 = { version = "0.6", features = ["imgref"] }
# PNG decoding for quantizer quality tests
png = "0.18"

[profile.release]
lto = "thin"
debug = 1  # For profiling

[profile.test]
opt-level = 2  # Tests need speed for processing

[[bench]]
name = "codec"
harness = false
