[package]
name = "zengif-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.zencodec]
version = ">=0.3.0, <0.5.0"
default-features = false

[dependencies.zengif]
path = ".."
features = ["std", "inventory"]

# Re-exported by zengif, but needed directly for fuzz targets
[dependencies.enough]
version = "0.4.5"
features = ["std"]

[dependencies.almost-enough]
version = "0.4.5"

# Explicit features for fuzzing
[features]
default = []

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_streaming"
path = "fuzz_targets/fuzz_decode_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_limits"
path = "fuzz_targets/fuzz_limits.rs"
test = false
doc = false
bench = false

# Recommended profile settings for fuzzing
[profile.release]
debug = 1
opt-level = 3

# For faster iteration during development
[profile.dev]
opt-level = 1

[patch.crates-io]
# Keep the unpublished pixel and codec families on the same integration cohort.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "e0dba0052a839ecfe17e4c911a3761e793605adf" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "e0dba0052a839ecfe17e4c911a3761e793605adf" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
