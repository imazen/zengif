[package]
name = "zengif-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.zencodec]
version = ">=0.2.0, <0.3.0"

[dependencies.zengif]
path = ".."
features = ["std", "inventory"]

# Re-exported by zengif, but needed directly for fuzz targets
[dependencies.enough]
version = "0.4"
features = ["std"]

[dependencies.almost-enough]
version = "0.4"

# Explicit features for fuzzing
[features]
default = []

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_streaming"
path = "fuzz_targets/fuzz_decode_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_limits"
path = "fuzz_targets/fuzz_limits.rs"
test = false
doc = false
bench = false

# Recommended profile settings for fuzzing
[profile.release]
debug = 1
opt-level = 3

# For faster iteration during development
[profile.dev]
opt-level = 1

# Dependency patch tables do not propagate: the same zencodec 0.2 family
# revision as the root manifest. Swap for the released zencodec before release.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "e59b3803fc5b212bf4c92648ead4299c4ff0640a" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
