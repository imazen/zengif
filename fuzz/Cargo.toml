[package]
name = "zengif-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.zengif]
path = ".."
features = ["std"]

# Re-exported by zengif, but needed directly for fuzz targets
[dependencies.enough]
version = "0.4"
features = ["std"]

[dependencies.almost-enough]
version = "0.4"

# Explicit features for fuzzing
[features]
default = []

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_streaming"
path = "fuzz_targets/fuzz_decode_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_limits"
path = "fuzz_targets/fuzz_limits.rs"
test = false
doc = false
bench = false

# The fuzz crate is its own cargo workspace, so it does NOT inherit the root
# Cargo.toml's [patch.crates-io]. Mirror it here so the fuzz targets resolve the
# same unreleased zencodec (taxonomy: `CategorizedError`/`ErrorCategory`, plus
# the zencodec-testkit `check_decode_truncation_series` check, PR #112) that
# zengif is built against. TEMP: until zencodec 0.1.26 ships (PR #103) — remove
# this patch and bump the zencodec version once 0.1.26 is published.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "c3220d51d2ef8ec16e8328ada2d5a04c7e6750ee" }

# Recommended profile settings for fuzzing
[profile.release]
debug = 1
opt-level = 3

# For faster iteration during development
[profile.dev]
opt-level = 1
