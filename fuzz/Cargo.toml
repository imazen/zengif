[package]
name = "zengif-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.zencodec]
version = ">=0.1.26, <0.3.0"

[dependencies.zengif]
path = ".."
features = ["std", "inventory"]

# Re-exported by zengif, but needed directly for fuzz targets
[dependencies.enough]
version = "0.4"
features = ["std"]

[dependencies.almost-enough]
version = "0.4"

# Explicit features for fuzzing
[features]
default = []

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_streaming"
path = "fuzz_targets/fuzz_decode_streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_limits"
path = "fuzz_targets/fuzz_limits.rs"
test = false
doc = false
bench = false

# Recommended profile settings for fuzzing
[profile.release]
debug = 1
opt-level = 3

# For faster iteration during development
[profile.dev]
opt-level = 1

# Depends on imazen/zencodec#133 (structural inventories). Swap this patch for the
# released zencodec before merge.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "3ef1cfde5e781d10eaf966253da7697e662be362" }
